### ~/.config/MangoHud/MangoHud.conf

### Hud
width=260
# height=140
cellpadding_y=-0.085
legacy_layout=false
table_columns=3
horizontal=false
background_alpha=0.4
round_corners=8
font_size=18
position=top-left
hud_no_margin=0
toggle_hud=Shift_R+F12

### Time
time
time_format=%T

### Version
# version

### GPU
gpu_text=GPU
gpu_color=39F900
gpu_stats
gpu_load_change
gpu_load_color=39F900,FDFD09,B22222
gpu_temp
gpu_junction_temperature
gpu_fan
gpu_core_clock
gpu_power
gpu_voltage
gpu_efficiency

### CPU
cpu_text=CPU
cpu_color=2E97CB
cpu_stats
cpu_load_change
cpu_load_color=39F900,FDFD09,B22222
cpu_temp
cpu_mhz
cpu_power
# cpu_efficiency

### IO
io_read
io_write

### VRAM / RAM
vram
gpu_mem_temp
gpu_mem_clock
ram
ram_color=C26693
procmem
procmem_shared
procmem_virt

### Vulkan / driver info
vulkan_driver
gpu_name
# arch
# wine

### FPS / frametime
fps
fps_color_change
fps_sampling_period=500
fps_metrics=avg,0.01,0.001
fps_value=30,60
fps_color=B22222,FDFD09,39F900
frame_timing
frame_timing_detailed
frametime

### Extra status lines
frame_count
gamemode
vkbasalt
resolution
present_mode
display_server