# void-dots Ansible configuration.
# Relative paths resolve against this file's directory. Run with
# ANSIBLE_CONFIG pointing here (bootstrap.sh does) or from inside ansible/.

[defaults]
roles_path = ./roles
library = ./library
module_utils = ./module_utils

# Builtin-only policy: only ansible.builtin.* and our own void_* modules.
# collections_path points at a directory that does not exist, and sys.path
# scanning is off, so collections bundled with the full `ansible` package
# (community.general, ansible.posix, ...) can never be resolved.
collections_path = ./collections
collections_scan_sys_path = False

interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
display_skipped_hosts = False
nocows = True
forks = 10

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
