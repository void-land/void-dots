# shellcheck shell=bash
# shellcheck disable=SC2034  # every variable here is read by the scripts that source it

# ─────────────────────────────────────────────
#  KDE settings — applied by scripts/void-kde-setup
# ─────────────────────────────────────────────
# Sourced, never executed. KDE rewrites its rc files constantly, so instead
# of symlinking them this file lists only the settings worth keeping and
# void-kde-setup writes them with kwriteconfig6 / KWin D-Bus.
# Run `void-kde-setup -c` to see where the live desktop has drifted from it.

# ─────────────────────────────────────────────
#  Session environment
# ─────────────────────────────────────────────
# Written to ~/.config/plasma-workspace/env/void-env.sh, which Plasma
# sources at login. "NAME=value", one per entry.
KDE_SESSION_ENV=(
	"KWIN_DRM_DISABLE_TRIPLE_BUFFERING=1"
)

# ─────────────────────────────────────────────
#  Theme
# ─────────────────────────────────────────────
KDE_LOOK_AND_FEEL="org.kde.breezedark.desktop"
KDE_COLOR_SCHEME="BreezeDark"

# ─────────────────────────────────────────────
#  Virtual desktops (in order)
# ─────────────────────────────────────────────
KDE_DESKTOPS=(
	"Browsers"
	"Code"
	"Social"
	"Gaming"
)
KDE_DESKTOP_ROWS=1

# ─────────────────────────────────────────────
#  KWin effects (kwinrc [Plugins] <name>Enabled)
# ─────────────────────────────────────────────
KWIN_EFFECTS_ENABLE=(magiclamp blur)
KWIN_EFFECTS_DISABLE=(squash desktopchangeosd)

# ─────────────────────────────────────────────
#  Shortcuts — "component|action|keys"
# ─────────────────────────────────────────────
# Only the ones that differ from Plasma's defaults. \t separates alternate
# keys, "none" clears a binding, "/" in the component nests groups.
# services/* entries are app launchers (raw keys, no default/description).
# Applied by kglobalaccel at the next login.
KDE_SHORTCUTS=(
	"kwin|Window Close|Alt+F4\tMeta+C"
	"KDE Keyboard Layout Switcher|Switch to Next Keyboard Layout|Meta+Space"
	"org_kde_powerdevil|Turn Off Screen|Meta+K"
	"plasmashell|manage activities|none"
	"plasmashell|next activity|Meta+A"
	"plasmashell|previous activity|Meta+Shift+A"
	"services/Alacritty.desktop|New|Meta+Q"
)

# ─────────────────────────────────────────────
#  Everything else — "file|group|key|value"
# ─────────────────────────────────────────────
# "/" in the group nests groups ([AC][Display] → AC/Display).
KDE_CONFIG=(
	# Default apps & look
	"kdeglobals|General|TerminalApplication|alacritty"
	"kdeglobals|General|TerminalService|Alacritty.desktop"
	"kdeglobals|General|BrowserApplication|google-chrome.desktop"
	"kdeglobals|General|accentColorFromWallpaper|true"
	"kdeglobals|KDE|contrast|4"
	"kdeglobals|KDE|frameContrast|0.2"

	# File dialog
	"kdeglobals|KFileDialog Settings|Allow Expansion|false"
	"kdeglobals|KFileDialog Settings|Automatically select filename extension|true"
	"kdeglobals|KFileDialog Settings|Breadcrumb Navigation|true"
	"kdeglobals|KFileDialog Settings|Decoration position|2"
	"kdeglobals|KFileDialog Settings|Show Full Path|false"
	"kdeglobals|KFileDialog Settings|Show Inline Previews|true"
	"kdeglobals|KFileDialog Settings|Show Preview|false"
	"kdeglobals|KFileDialog Settings|Show Speedbar|true"
	"kdeglobals|KFileDialog Settings|Show hidden files|false"
	"kdeglobals|KFileDialog Settings|Sort by|Name"
	"kdeglobals|KFileDialog Settings|Sort directories first|true"
	"kdeglobals|KFileDialog Settings|Sort hidden files last|false"
	"kdeglobals|KFileDialog Settings|Sort reversed|false"
	"kdeglobals|KFileDialog Settings|Speedbar Width|170"
	"kdeglobals|KFileDialog Settings|View Style|DetailTree"

	# KWin
	"kwinrc|Wayland|VirtualKeyboardMode|2"
	"kwinrc|Xwayland|Scale|1"
	"kwinrc|Xwayland|XwaylandEisNoPromptApps|xdotool"

	# Keyboard layouts: us + Persian (winkeys)
	"kxkbrc|Layout|Use|true"
	"kxkbrc|Layout|LayoutList|us,ir"
	"kxkbrc|Layout|VariantList|,winkeys"
	"kxkbrc|Layout|DisplayNames|,"

	# Mouse: flat acceleration
	"kcminputrc|Mouse|X11LibInputXAccelProfileFlat|true"
	"kcminputrc|Libinput/1133/49291/Logitech G502 HERO SE|PointerAccelerationProfile|1"

	# Power (on AC): dim 10 min, screen off 15 min / 5 min locked, never suspend
	"powerdevilrc|AC/Display|DimDisplayIdleTimeoutSec|600"
	"powerdevilrc|AC/Display|TurnOffDisplayIdleTimeoutSec|900"
	"powerdevilrc|AC/Display|TurnOffDisplayIdleTimeoutWhenLockedSec|300"
	"powerdevilrc|AC/Keyboard|KeyboardBrightness|100"
	"powerdevilrc|AC/SuspendAndShutdown|AutoSuspendAction|0"

	# Search & session
	"baloofilerc|Basic Settings|Indexing-Enabled|false"
	"krunnerrc|Plugins|baloosearchEnabled|false"
	"ksmserverrc|General|loginMode|emptySession"

	# Dolphin
	"dolphinrc|DetailsMode|PreviewSize|16"
	"dolphinrc|KFileDialog Settings|Places Icons Auto-resize|false"
	"dolphinrc|KFileDialog Settings|Places Icons Static Size|22"
	"dolphinrc|MainWindow|MenuBar|Disabled"
)

# ─────────────────────────────────────────────
#  Default applications — "mime=desktop file"
# ─────────────────────────────────────────────
KDE_MIME_DEFAULTS=(
	"image/avif=org.kde.gwenview.desktop"
	"image/bmp=org.kde.gwenview.desktop"
	"image/heif=org.kde.gwenview.desktop"
	"image/jpeg=org.kde.gwenview.desktop"
	"image/png=org.kde.gwenview.desktop"
	"image/webp=org.kde.gwenview.desktop"
	"text/html=google-chrome.desktop"
	"text/x-shellscript=org.kde.kate.desktop"
	"x-scheme-handler/http=google-chrome.desktop"
	"x-scheme-handler/https=google-chrome.desktop"
	"x-scheme-handler/claude-cli=claude-code-url-handler.desktop"
	"x-scheme-handler/discord=vesktop.desktop"
	"x-scheme-handler/hydralauncher=hydralauncher.desktop"
	"x-scheme-handler/throne=throne-url-handler.desktop"
	"x-scheme-handler/openpencil=OpenPencil-handler.desktop"
)

# ─────────────────────────────────────────────
#  EndeavourOS welcome (skipped without eos-welcome)
# ─────────────────────────────────────────────
EOS_GREETER=disable
EOS_GREETER_ONCE_DAILY=no
EOS_WELCOME_ACTIVE_TAB=2

# ─────────────────────────────────────────────
#  Panel — applied by scripts/void-kde-panel
# ─────────────────────────────────────────────
PANEL_HEIGHT=46

PAGER_SHOW_ONLY_CURRENT_SCREEN=true
PAGER_SHOW_WINDOW_ICONS=true

# Task manager pins, in order. applications:* entries whose .desktop file
# isn't installed are skipped; preferred://* follow the mime defaults above.
PANEL_LAUNCHERS=(
	"applications:systemsettings.desktop"
	"preferred://filemanager"
	"applications:codium.desktop"
	"preferred://browser"
	"applications:org.telegram.desktop.desktop"
	"applications:vesktop.desktop"
	"applications:steam.desktop"
	"applications:spotify-adblock.desktop"
	"applications:Throne.desktop"
	"applications:hydra.desktop"
)
